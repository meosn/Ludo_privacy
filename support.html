<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержка — Лудо</title>
<style>
  :root {
    --paper: rgba(255, 252, 239, 0.94);
    --ink: #35220f;
    --muted: #725d43;
    --gold: #d79b25;
    --red: #d9352b;
    --green: #2fa85d;
    --line: rgba(120, 77, 24, 0.18);
    --shadow: 0 24px 70px rgba(47, 28, 11, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 28px 16px 64px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background-color: #f8d87a;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(217, 53, 43, 0.18) 0 7px, transparent 8px),
      radial-gradient(circle at 86% 14%, rgba(47, 168, 93, 0.2) 0 9px, transparent 10px),
      radial-gradient(circle at 78% 78%, rgba(53, 34, 15, 0.14) 0 8px, transparent 9px),
      linear-gradient(rgba(255, 240, 172, 0.28), rgba(255, 244, 197, 0.38));
    background-attachment: fixed;
  }

  main {
    position: relative;
    max-width: 860px;
    margin: 0 auto;
    padding: 34px 42px 44px;
    line-height: 1.58;
    background: var(--paper);
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 18px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(140, 94, 31, 0.12);
    overflow: hidden;
  }

  main::before {
    content: "";
    position: absolute;
    width: 88px;
    height: 88px;
    top: 22px;
    right: 26px;
    border-radius: 16px;
    background:
      radial-gradient(circle at 28% 28%, #2d2a26 0 5px, transparent 6px),
      radial-gradient(circle at 72% 28%, #2d2a26 0 5px, transparent 6px),
      radial-gradient(circle at 50% 50%, #2d2a26 0 5px, transparent 6px),
      radial-gradient(circle at 28% 72%, #2d2a26 0 5px, transparent 6px),
      radial-gradient(circle at 72% 72%, #2d2a26 0 5px, transparent 6px),
      #fff8e6;
    border: 2px solid rgba(75, 47, 18, 0.22);
    transform: rotate(11deg);
    filter: drop-shadow(0 10px 12px rgba(44, 27, 8, 0.18));
  }

  .content { position: relative; z-index: 1; }
  .brand { display: inline-flex; gap: 10px; align-items: center; margin-bottom: 10px; font-weight: 800; color: var(--red); text-transform: uppercase; }
  .brand-dot { position: relative; width: 56px; height: 16px; flex: 0 0 56px; }
  .brand-dot::before, .brand-dot::after { content: ""; position: absolute; top: 0; width: 16px; height: 16px; border-radius: 50%; }
  .brand-dot::before { left: 0; background: var(--green); box-shadow: 20px 0 0 var(--gold); }
  .brand-dot::after { left: 40px; background: #2d2a26; }
  h1 { max-width: 620px; font-size: 34px; line-height: 1.08; margin: 0 0 8px; color: #2b1a0b; }
  h2 { font-size: 20px; line-height: 1.25; margin: 30px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); color: #4b2f12; }
  p { font-size: 16px; margin: 8px 0; }
  .sub { color: var(--muted); margin: 0 0 24px; font-weight: 600; }
  a { color: #a56f05; font-weight: 700; }

  @media (max-width: 680px) {
    body { padding: 14px 10px 40px; background-attachment: scroll; }
    main { padding: 26px 18px 34px; border-radius: 14px; }
    main::before { width: 58px; height: 58px; top: 14px; right: 14px; opacity: 0.8; }
    h1 { max-width: 260px; font-size: 27px; }
    h2 { font-size: 18px; }
    p { font-size: 15px; }
  }
</style>
</head>
<body>
<main>
  <div class="content">
    <div class="brand"><span class="brand-dot"></span><span>Лудо</span></div>
    <h1>Поддержка</h1>
    <p class="sub">Мы поможем решить вопросы по игре и приложению</p>

    <h2>Свяжитесь с нами</h2>
    <p>Если у вас есть вопрос, предложение или проблема с приложением, напишите нам:</p>
    <p><a href="mailto:mashkagame26@gmail.com">mashkagame26@gmail.com</a></p>

    <h2>Контактное лицо</h2>
    <p>Mikhail Vasilev</p>
  </div>
</main>
</body>
</html>
